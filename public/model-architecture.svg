<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/><stop offset="1" stop-color="#e8f1ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L13,5 z" fill="#314b57"/>
    </marker>
    <marker id="arrowfast" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L13,5 z" fill="#b0740f"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".16"/></filter>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#173b35}.sub{font:20px Arial,sans-serif;fill:#53666c}
      .box{stroke-width:2;rx:18;filter:url(#shadow)}.name{font:700 23px Arial,sans-serif;fill:#153d37;text-anchor:middle}
      .desc{font:17px Arial,sans-serif;fill:#486068;text-anchor:middle}.arrow{stroke:#314b57;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .link{stroke:#314b57;stroke-width:3;fill:none}
      .small{font:700 16px Arial,sans-serif;fill:#50666c;text-anchor:middle;letter-spacing:1px}
      .fastline{stroke:#b0740f;stroke-width:3;fill:none;stroke-dasharray:9 6;marker-end:url(#arrowfast)}
      .fastname{font:700 19px Arial,sans-serif;fill:#8a5a06;text-anchor:middle}
      .fastdesc{font:15px Arial,sans-serif;fill:#8a5a06;text-anchor:middle}
      .nameSm{font:700 20px Arial,sans-serif;fill:#153d37;text-anchor:middle}
      .terminal{font:700 17px Arial,sans-serif;fill:#173b35;text-anchor:middle;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <text x="80" y="75" class="title">Maintenance Copilot - Agent Architecture</text>
  <text x="80" y="110" class="sub">A guarded supervisor chooses tools, updates shared state, and returns a fully audited response.</text>

  <!-- Row A: request, safety gate, supervisor, emergency bypass -->
  <rect class="box" x="55" y="170" width="255" height="105" fill="#fff" stroke="#8ba39d"/>
  <text x="182" y="215" class="nameSm">Tenant / API Request</text><text x="182" y="245" class="desc">POST /api/execute</text>
  <path class="arrow" d="M310 222 H352"/>

  <rect class="box" x="358" y="170" width="240" height="105" fill="#fff1e8" stroke="#d68b5f"/>
  <text x="478" y="215" class="name">SafetyPreFilter</text><text x="478" y="245" class="desc">deterministic hazard gate</text>
  <path class="arrow" d="M598 222 H644"/>

  <rect class="box" x="650" y="160" width="300" height="140" fill="#dff1e9" stroke="#3e8b78"/>
  <text x="800" y="212" class="name">SupervisorAgent</text><text x="800" y="244" class="desc">LLMod reasoning + tool loop</text><text x="800" y="271" class="desc">maximum 6 iterations</text>

  <path class="arrow" d="M478 170 C645 118 1140 118 1298 160"/>
  <rect class="box" x="1268" y="160" width="294" height="130" fill="#ffe8e5" stroke="#c85f55"/>
  <text x="1415" y="208" class="nameSm">EmergencyResponseAgent</text><text x="1415" y="241" class="desc">LLMod safety reply</text><text x="1415" y="265" class="desc">no scheduling, no tools</text>
  <text x="1155" y="112" class="small">FORCE ESCALATE</text>

  <!-- Fast path badge: known low-risk issues skip the tool loop -->
  <path class="fastline" d="M910 300 L982 336"/>
  <rect class="box" x="990" y="320" width="290" height="98" fill="#fdf3dc" stroke="#b0740f" stroke-dasharray="9 6"/>
  <text x="1135" y="355" class="fastname">FAST PATH</text>
  <text x="1135" y="379" class="fastdesc">known low-risk issue: deterministic</text>
  <text x="1135" y="400" class="fastdesc">draft + 1 LLMod call, tool loop skipped</text>

  <!-- Tool fan-out -->
  <text x="628" y="443" class="small">AGENT-SELECTED TOOLS</text>
  <path class="arrow" d="M800 300 V460 H285 V490"/>
  <path class="arrow" d="M800 460 H628 V490"/>
  <path class="arrow" d="M800 460 H971 V490"/>
  <path class="arrow" d="M800 460 H1314 V490"/>

  <rect class="box" x="140" y="495" width="290" height="125" fill="#eef3ff" stroke="#7188bd"/>
  <text x="285" y="543" class="name">TenantGuidance</text><text x="285" y="576" class="desc">reversible containment steps</text><text x="285" y="601" class="desc">routing questions</text>

  <rect class="box" x="483" y="495" width="290" height="125" fill="#eef3ff" stroke="#7188bd"/>
  <text x="628" y="543" class="name">TaxonomySearch</text><text x="628" y="576" class="desc">Supabase HPD taxonomy</text><text x="628" y="601" class="desc">classification + urgency</text>

  <rect class="box" x="826" y="495" width="290" height="125" fill="#eef3ff" stroke="#7188bd"/>
  <text x="971" y="543" class="name">GuidanceRetriever</text><text x="971" y="576" class="desc">Pinecone official-source RAG</text><text x="971" y="601" class="desc">citations + policy evidence</text>

  <rect class="box" x="1169" y="495" width="290" height="125" fill="#eef3ff" stroke="#7188bd"/>
  <text x="1314" y="543" class="name">SchedulingTools</text><text x="1314" y="576" class="desc">approved vendors + slots</text><text x="1314" y="601" class="desc">explicit-choice booking guard</text>

  <!-- Tools write into shared state -->
  <path class="link" d="M285 620 V660"/><path class="link" d="M628 620 V660"/>
  <path class="link" d="M971 620 V660"/><path class="link" d="M1314 620 V660"/>
  <path class="link" d="M285 660 H1314"/>
  <path class="arrow" d="M800 660 V695"/>

  <rect class="box" x="630" y="700" width="340" height="125" fill="#fff6d8" stroke="#bb9730"/>
  <text x="800" y="748" class="name">SharedCaseState</text><text x="800" y="781" class="desc">one evolving work order</text><text x="800" y="806" class="desc">every tool reads and writes it</text>

  <!-- Observe and replan loop back into the supervisor -->
  <path class="arrow" d="M630 735 H450 V330 H645 V300"/>
  <text x="560" y="362" class="small">OBSERVE + REPLAN</text>

  <path class="arrow" d="M630 790 H425"/>
  <rect class="box" x="110" y="700" width="310" height="125" fill="#eee9f8" stroke="#7d68aa"/>
  <text x="265" y="748" class="name">SupabaseAuditStore</text><text x="265" y="781" class="desc">cases + messages</text><text x="265" y="806" class="desc">ordered LLM call events</text>

  <!-- Response -->
  <path class="arrow" d="M800 825 V925"/>
  <path class="arrow" d="M1500 290 V945 C1500 975 1330 985 1172 985"/>
  <rect class="box" x="535" y="930" width="625" height="110" fill="#173b35" stroke="#173b35"/>
  <text x="847" y="976" style="font:700 25px Arial,sans-serif;fill:#fff;text-anchor:middle">Response + LLM Steps</text>
  <text x="847" y="1011" style="font:18px Arial,sans-serif;fill:#d7e6e1;text-anchor:middle">tenant-facing answer and every model prompt/response in order</text>

  <text x="847" y="1092" class="small">TERMINAL STATES</text>
  <text x="847" y="1124" class="terminal">needs_info · awaiting_tenant · scheduled · escalated (manager review) · resolved</text>
</svg>
